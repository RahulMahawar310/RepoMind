services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  redis:
    image: redis:7-alpine
  rag-service:
    build: ./rag-service
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes: ["./rag-data:/srv/data"]
    ports: ["8000:8000"]
    depends_on: [qdrant]
  backend:
    build: ./backend
    environment:
      RAG_URL: http://rag-service:8000
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on: [rag-service, redis]
volumes:
  qdrant_data:
